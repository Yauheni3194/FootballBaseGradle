<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- 1. Этот тег исправит мелкий шрифт и масштаб на экранах телефонов -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ошибка сервера</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px 15px; /* Отступы, чтобы на телефонах карточка не липла к краям */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Центрируем ошибку по вертикали на любом экране */
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    h1 {
      color: #dc3545;
      font-size: 22px; /* Чуть уменьшили для небольших экранов, чтобы текст не переносился криво */
      margin-top: 0;
    }
    p {
      color: #6c757d;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    /* Крупная и заметная кнопка «Назад» для мобильного интерфейса */
    .btn {
      display: block; /* Растягиваем на всю ширину на мобильных для удобства нажатия */
      padding: 14px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0056b3;
    }

    /* На больших экранах ноутбуков кнопка не будет растягиваться на всю ширину */
    @media (min-width: 480px) {
      .btn {
        display: inline-block;
        width: auto;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Не удалось выполнить операцию!</h1>
  <p>Запись нельзя удалить, так как на это место всё ещё есть ссылки в таблице "game"</p>
  <a href="javascript:history.back()" class="btn">Вернуться назад</a>
</div>
</body>
</html>
