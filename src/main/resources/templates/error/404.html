<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- 1. Этот тег автоматически адаптирует масштаб под экран телефона -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена (404)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px 15px; /* Отступы, чтобы контент не лип к краям экрана */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh; /* Центрирует ошибку по вертикали на любом смартфоне */
      box-sizing: border-box;
    }
    .error-container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 35px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      box-sizing: border-box;
    }
    .error-code {
      font-size: 72px;
      font-weight: bold;
      color: #6c757d;
      margin: 0 0 10px 0;
      line-height: 1;
    }
    h1 {
      color: #212529;
      font-size: 22px;
      margin: 0 0 15px 0;
    }
    p {
      color: #6c757d;
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 25px 0;
    }

    /* Техническая информация в мобильном спойлере */
    details {
      margin-bottom: 25px;
      text-align: left;
      background: #f1f3f5;
      padding: 12px;
      border-radius: 6px;
    }
    summary {
      font-size: 14px;
      color: #495057;
      cursor: pointer;
      font-weight: bold;
      outline: none;
    }
    .tech-info {
      color: #6c757d;
      margin-top: 10px;
      font-size: 13px;
    }
    .tech-info p {
      margin: 5px 0;
      font-family: monospace;
      font-size: 13px;
      word-break: break-all; /* Чтобы длинные URL не ломали верстку на смартфонах */
    }

    /* Крупная мобильная кнопка возврата */
    .btn {
      display: block;
      padding: 14px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 2px 6px rgba(0, 123, 255, 0.2);
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0056b3;
    }

    @media (min-width: 480px) {
      .btn {
        display: inline-block;
        width: auto;
      }
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="error-code">404</div>
  <h1>Страница не найдена</h1>
  <p>К сожалению, запрашиваемая страница не существует или была перемещена.</p>

  <!-- Использование тега details позволяет спрятать логи для обычных пользователей -->
  <details>
    <summary>Техническая информация для отладки</summary>
    <div class="tech-info">
      <p><strong>Путь:</strong> <span th:text="${path}">/unknown</span></p>
      <p><strong>Время:</strong> <span th:text="${timestamp}">2026-08-17</span></p>
    </div>
  </details>

  <a th:href="@{/}" class="btn">Вернуться на главную</a>
</div>
</body>
</html>
