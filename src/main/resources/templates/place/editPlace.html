<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <!-- 1. Главный тег для адаптации масштаба на экранах телефонов -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit place</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f8f9fa;
      color: #333;
      box-sizing: border-box;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #212529;
    }

    /* Адаптивная карточка для формы */
    .form-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 15px;
    }

    /* Крупные текстовые поля ввода под тач-интерфейс */
    .form-control {
      width: 100%;
      padding: 12px;
      font-size: 16px; /* Защита от автозума на iOS */
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      background-color: #fff;
      color: #495057;
    }

    .form-control:focus {
      border-color: #80bdff;
      outline: 0;
      box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
    }

    /* Подсветка ошибок валидации Spring */
    .error-block {
      color: #dc3545;
      font-size: 14px;
      font-weight: bold;
      margin-top: 5px;
    }

    .global-errors {
      background-color: #f8d7da;
      color: #721c24;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 14px;
    }
    .global-errors p {
      margin: 0;
    }

    /* Кнопка отправки формы */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #ffc107; /* Желтый цвет для акцента на изменении */
      color: #212529;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #e0a800;
    }

    /* Кнопка возврата назад */
    .btn-back {
      display: block;
      text-align: center;
      padding: 12px;
      background-color: #6c757d;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
    }
    .btn-back:hover {
      background-color: #5a6268;
    }
  </style>
</head>
<body>

<h1>Редактирование места</h1>

<div class="form-container">
  <form th:method="POST" th:action="@{/places/{id}/edit(id=${place.getId()})}" th:object="${place}">

    <!-- 2. Блок глобальных ошибок находится внутри формы, чтобы избежать ошибок биндинга Thymeleaf -->
    <div th:if="${#fields.hasGlobalErrors()}" class="global-errors">
      <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
    </div>

    <!-- Скрытое поле ID -->
    <input type="hidden" th:field="*{id}" id="id">

    <!-- Поле: Название -->
    <div class="form-group">
      <label for="name">Enter name:</label>
      <input type="text" th:field="*{name}" id="name" class="form-control"/>
      <div class="error-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
    </div>

    <!-- Поле: Адрес -->
    <div class="form-group">
      <label for="address">Enter address:</label>
      <input type="text" th:field="*{address}" id="address" class="form-control"/>
      <div class="error-block" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Address Error</div>
    </div>

    <!-- Поле: Телефон администратора -->
    <div class="form-group">
      <label for="administrator_phone_number">Enter administrator phone number:</label>
      <!-- На смартфонах type="tel" сразу откроет цифровую клавиатуру для удобного ввода -->
      <input type="tel" th:field="*{administrator_phone_number}" id="administrator_phone_number" class="form-control"/>
      <div class="error-block" th:if="${#fields.hasErrors('administrator_phone_number')}" th:errors="*{administrator_phone_number}">Administrator_phone_number Error</div>
    </div>

    <!-- Кнопка сохранения с диалоговым окном подтверждения -->
    <input type="submit" value="Edit!" class="btn-submit" onclick="return confirm('Изменить место?');"/>
  </form>
</div>

<!-- Ссылка возврата на детальную страницу места -->
<a th:href="@{/places/{id}(id=${place.getId()})}" class="btn-back">Back</a>

</body>
</html>
