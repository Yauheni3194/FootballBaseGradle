<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 1. Этот тег автоматически адаптирует масштаб под экраны телефонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: #f8f9fa;
            color: #333;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #212529;
        }

        /* Стильная адаптивная карточка формы */
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        /* Крупные поля ввода, адаптированные под тач-интерфейс */
        .form-control {
            width: 100%;
            padding: 12px;
            font-size: 16px; /* Защищает от автозума страницы в мобильных браузерах */
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #fff;
            color: #495057;
        }

        .form-control:focus {
            border-color: #80bdff;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }

        /* Блоки вывода ошибок валидации полей */
        .error-block {
            color: #dc3545;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Блок для глобальных ошибок уровня объекта */
        .global-errors {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .global-errors p {
            margin: 0;
        }

        /* Крупная кнопка отправки */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        /* Кнопка возврата назад */
        .btn-back {
            display: block;
            text-align: center;
            padding: 12px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<h1>Регистрация нового игрока</h1>

<div class="form-container">
    <!-- Вся логика разметки находится внутри контекста th:object -->
    <form th:method="POST" th:action="@{/players}" th:object="${player}">

        <!-- Гарантируем правильный биндинг глобальных ошибок внутри тега form -->
        <div th:if="${#fields.hasGlobalErrors()}" class="global-errors">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <!-- Поле: Имя -->
        <div class="form-group">
            <label for="name">Enter name:</label>
            <input type="text" th:field="*{name}" id="name" class="form-control" placeholder="Иван"/>
            <div class="error-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</div>
        </div>

        <!-- Поле: Фамилия -->
        <div class="form-group">
            <label for="surname">Enter surname:</label>
            <input type="text" th:field="*{surname}" id="surname" class="form-control" placeholder="Иванов"/>
            <div class="error-block" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}">Surname Error</div>
        </div>

        <!-- Поле: Возраст -->
        <div class="form-group">
            <label for="age">Enter age:</label>
            <!-- На смартфонах type="number" сразу откроет цифровую клавиатуру -->
            <input type="number" th:field="*{age}" id="age" class="form-control" placeholder="25" min="1" max="120"/>
            <div class="error-block" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age Error</div>
        </div>

        <!-- Поле: Город -->
        <div class="form-group">
            <label for="city">Enter city:</label>
            <input type="text" th:field="*{city}" id="city" class="form-control" placeholder="Минск"/>
            <div class="error-block" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">City Error</div>
        </div>

        <input type="submit" value="Create!" class="btn-submit"/>
    </form>
</div>

<a href="/players" class="btn-back">Back</a>

</body>
</html>
