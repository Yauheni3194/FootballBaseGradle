<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security" lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- 1. Главный тег для правильного масштаба на телефонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
            background-color: #f8f9fa;
            color: #333;
            box-sizing: border-box;
        }

        /* Навигация сверху */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-nav {
            display: inline-block;
            text-align: center;
            padding: 10px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-admin {
            background-color: #dc3545;
        }

        /* Главная карточка с деталями игры */
        .game-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .game-info-row {
            font-size: 16px;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .game-info-row a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        /* Блок участников */
        .players-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        ol {
            padding-left: 20px;
            margin: 10px 0;
        }
        li {
            margin-bottom: 8px;
            font-size: 16px;
        }

        /* Кнопки действий (Пойти / Отказаться) */
        .action-forms {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .action-forms form {
            flex: 1;
        }
        .action-forms input[type="submit"] {
            width: 100%;
            padding: 14px 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-join {
            background-color: #28a745;
            color: white;
        }
        .btn-leave {
            background-color: #e0a800;
            color: #212529;
        }

        /* Секция комментариев */
        .comments-section {
            margin-top: 30px;
        }
        .comment-box {
            background: white;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border-left: 3px solid #6c757d;
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        .comment-text {
            margin: 0 0 10px 0;
            white-space: pre-line;
            font-size: 15px;
            line-height: 1.4;
        }
        .btn-delete-comment {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 13px;
            padding: 0;
            text-decoration: underline;
        }

        /* Форма отправки нового комментария */
        .comment-form {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .comment-form label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px; /* Защита от автозума на iOS */
            resize: vertical;
        }
        .btn-submit-comment {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Системные уведомления */
        .alert {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 14px;
        }
        .alert-success { background-color: #d4edda; color: #155724; }
        .alert-danger { background-color: #f8d7da; color: #721c24; font-weight: bold; }
    </style>
</head>
<body>

<!-- Навигация -->
<div class="nav-links">
    <a href="/games" class="btn-nav">← Show all games</a>
    <a th:href="@{/games/{id}/changeGameAsAdmin(id=${game.getId()})}" class="btn-nav btn-admin">Change game as admin</a>
</div>

<!-- Карточка матча / игры -->
<div class="game-card">
    <div class="game-info-row">
        <strong>Place:</strong>
        <a th:href="@{/places/{id}(id=${place.getId()})}" th:text="${place.getName()}">Place Name</a>
    </div>
    <div class="game-info-row"><strong>Date:</strong> <span th:text="${game.getDate()}">Date</span></div>
    <div class="game-info-row"><strong>Time:</strong> <span th:text="${game.getTime()}">Time</span></div>
    <div class="game-info-row"><strong>Status:</strong> <span th:text="${game.getStatus()}">Status</span></div>

    <div th:if="${updateGame}" class="alert alert-success">
        <p th:text="${updateGame}" style="margin:0;"></p>
    </div>
</div>

<!-- Блок участников -->
<div class="players-section">
    <h3>Участники:</h3>
    <ol th:if="${not #lists.isEmpty(players)}">
        <li th:each="player : ${players}" th:text="${player.getName()}+' '+${player.getSurname()}"></li>
    </ol>
    <p th:if="${#lists.isEmpty(players)}" style="color: #666; font-style: italic;">Никто не пришел</p>

    <!-- Кнопки действий -->
    <div class="action-forms">
        <form th:method="POST" th:action="@{/games/{id}/addPlayer(id=${game.getId()})}">
            <input type="submit" value="Пойти" class="btn-join"/>
        </form>

        <form th:method="POST" th:action="@{/games/{id}/deletePlayer(id=${game.getId()})}">
            <input type="submit" value="Отказаться" class="btn-leave"/>
        </form>
    </div>

    <!-- Уведомления об участии -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}" style="margin:0;"></p>
    </div>
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}" style="margin:0;"></p>
    </div>
</div>

<!-- Секция комментариев -->
<div class="comments-section">
    <h3>Комментарии:</h3>

    <div th:if="${deleteCommentError}" class="alert alert-danger">
        <p th:text="${deleteCommentError}" style="margin:0;"></p>
    </div>
    <div th:if="${deleteCommentSuccess}" class="alert alert-success">
        <p th:text="${deleteCommentSuccess}" style="margin:0;"></p>
    </div>

    <div th:if="${not #lists.isEmpty(comments)}">
        <div th:each="comment : ${comments}" class="comment-box">
            <div class="comment-header">
                <strong th:text="${comment.getPlayer().getName()} + ' ' + ${comment.getPlayer().getSurname()}">Автор</strong>
                <span th:text="${#temporals.format(comment.getCreatedAt(), 'dd.MM.yyyy HH:mm')}">Дата</span>
            </div>

            <p th:text="${comment.getText()}" class="comment-text"></p>

            <!-- Удаление автором -->
            <div th:if="${currentUser != null and (comment.getPlayer().getId() == currentUser.id)}">
                <form th:method="POST" th:action="@{/games/{id}/deleteComment/{commentId}(id=${game.getId()}, commentId=${comment.getId()})}">
                    <input type="submit" value="Удалить" class="btn-delete-comment" onclick="return confirm('Удалить комментарий?');"/>
                </form>
            </div>
            <!-- Удаление админом -->
            <div sec:authorize="hasRole('ROLE_ADMIN')" th:if="${currentUser == null or comment.getPlayer().getId() != currentUser.getId()}">
                <form th:method="POST" th:action="@{/games/{id}/deleteComment/{commentId}(id=${game.getId()}, commentId=${comment.getId()})}">
                    <input type="submit" value="Удалить (Админ)" class="btn-delete-comment" onclick="return confirm('Удалить комментарий?');"/>
                </form>
            </div>
        </div>
    </div>

    <!-- Форма отправки нового комментария -->
    <div class="comment-form">
        <form th:method="POST" th:action="@{/games/{id}/addComment(id=${game.getId()})}">
            <label th:for="comment-text">Оставить комментарий:</label>
            <textarea id="comment-text" name="text" rows="3" required placeholder="Напишите ваш комментарий..."></textarea>
            <input type="submit" value="Отправить" class="btn-submit-comment"/>
        </form>
        <div th:if="${comment_error}" class="alert alert-danger" style="margin-top:10px;">
            <p th:text="${comment_error}" style="margin:0;"></p>
        </div>
    </div>
</div>

</body>
</html>
